<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F1FF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141127" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Arena</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="auth" class="screen auth hidden">
    <div class="auth-box">
      <div class="auth-mascots" id="authMascots" aria-hidden="true"></div>
      <h1>Arena</h1>
      <p class="muted">Jocuri cu gașca, un clasament care se resetează în fiecare luni și mascote caraghioase.</p>
      <form id="authForm" novalidate>
        <label>Nume<input id="authName" autocomplete="username" maxlength="20" required></label>
        <label>Parolă<input id="authPass" type="password" autocomplete="current-password" required></label>
        <label id="codeWrap" class="hidden">Cod de invitație<input id="authCode" autocomplete="off"></label>
        <div class="stack">
          <button type="submit" data-mode="login" id="loginBtn" class="btn primary big">Intră în arenă</button>
          <button type="submit" data-mode="register" id="registerBtn" class="btn big hidden">Creează cont</button>
        </div>
        <p id="authNote" class="muted small center"></p>
        <p id="authError" class="error center" role="alert"></p>
      </form>
    </div>
  </div>

  <div id="builder" class="screen hidden"></div>

  <div id="app" class="hidden">
    <div id="conn" class="banner hidden">Conexiunea s-a întrerupt. Se reconectează…</div>
    <main id="main"></main>
    <nav class="bottom-nav" id="nav" aria-label="Secțiuni">
      <button data-tab="play" class="nav-btn active"><span class="nav-ico">🎮</span><span>Joacă</span></button>
      <button data-tab="vote" class="nav-btn"><span class="nav-ico">🗳️</span><span>Vot</span></button>
      <button data-tab="board" class="nav-btn"><span class="nav-ico">🏆</span><span>Clasament</span></button>
      <button data-tab="me" class="nav-btn"><span class="nav-ico" id="navMe">🙂</span><span>Eu</span></button>
    </nav>
  </div>

  <div id="sheet" class="sheet-wrap hidden"><div class="sheet" id="sheetBox"></div></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box" id="modalBox"></div></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="confetti" aria-hidden="true"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/mascot.js"></script>
  <script src="/app.js"></script>
</body>
</html>
